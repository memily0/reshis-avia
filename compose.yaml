services:
  app:
    build: .
    restart: unless-stopped
    environment:
      RESHIS_AVIA_DB: /data/users.db
      RESHIS_AVIA_COOKIE_SECURE: "true"
      RESHIS_AVIA_ALLOWED_ORIGINS: "https://${APP_DOMAIN:?Set APP_DOMAIN to your VPS IP followed by .sslip.io}"
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?Set APP_DOMAIN to your VPS IP followed by .sslip.io}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  app_data:
  caddy_data:
  caddy_config:
